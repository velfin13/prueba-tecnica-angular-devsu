<div class="backdrop" (click)="onBackdropClick($event)">
  <div
    #dialog
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-message"
    (keydown)="onKeydown($event)"
  >
    <div class="body">
      <p id="confirm-message" class="message">{{ message() }}</p>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
    </div>
    <div class="actions">
      <button #cancelButton type="button" class="btn btn-secondary" [disabled]="busy()" (click)="onCancel()">
        Cancelar
      </button>
      <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="confirm.emit()">
        {{ busy() ? 'Eliminando...' : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
